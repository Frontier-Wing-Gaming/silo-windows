name: Release

# Push a tag like v0.2.0 to build the installers and attach them to a GitHub release.
# Set the same version in src-tauri/tauri.conf.json and src-tauri/Cargo.toml first.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installers:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test
        working-directory: src-tauri
        run: cargo test --locked

      # Bundles mpv with its GPL license and source pointers (mpv/LICENSE.GPL.txt, mpv/SOURCE.txt).
      - name: Fetch mpv
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/fetch-mpv.ps1

      - name: Build installers
        run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: silolux-windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
